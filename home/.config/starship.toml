format = """\
($status)\
╭╴$time \
$username\
$directory\
$os\
$git_branch\
$git_commit\
${custom.git_last_commit_days}\
$git_status \
(\
    via\
    $python\
    $conda\
    $nodejs\
    $c\
    $rust\
    $java$gradle$maven\
)\
$docker_context\
$cmd_duration
\
╰─▶ \
"""

add_newline = false

[status]
disabled = false
symbol = "ERROR"
#success_symbol = "OK"
# success_style = "fg:time"
# format = "[$symbol]($style)[$success_symbo]($success_style)\n"
format = "[$symbol]($style)\n"


[time]
disabled = false
format = "\\[[$time]($style)\\]"
time_format = "%H:%M:%S"
style = "green"

[username]
disabled = true
style_user = 'os'
style_root = 'os_admin'
format = '[  $user](fg:$style) '
show_always = true

[directory]
disabled = false
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 2
style = "blue"
read_only_style = "fg:directory"
before_repo_root_style = "fg:directory"
truncation_symbol = "…/"
truncate_to_repo = true
read_only ="  "

[os]
disabled = true
format = "on [($name)]($style)"
style = "blue"

[os.symbols]
Alpine = " "
Arch = " "
Debian = " "
EndeavourOS = " "
Fedora = " "
Linux = " "
Macos = " "
Manjaro = " "
Mint = " "
NixOS = " "
openSUSE = " "
Pop = " "
SUSE = " "
Ubuntu = " "
Windows = " "

[git_branch]
disabled = false
symbol = ""
format = " on [${symbol}${branch}]($style)"
style = "purple"

[git_commit]
disabled = false
tag_symbol = ""
style = "bright-white underline"
format = "( [$tag]($style))"
tag_disabled = false
only_detached = false

[custom.git_last_commit_days]
command = """
commit_time=$(git log -1 --format=%ct 2>/dev/null)
if [ -n "$commit_time" ]; then
  now=$(date +%s)
  diff=$(( (now - commit_time) / 86400 ))
  echo "${diff}d ago"
fi
"""
when = "git rev-parse --is-inside-work-tree 2> /dev/null"
format = " [$output](yellow)"

[git_status]
disabled = false

format = '([$staged](green)[$untracked](green)[$modified](yellow)[$deleted](red)([$stashed](white)))'

staged = ' +$count'

untracked = ' !$count'

modified = ' !$count'

deleted = ' !$count'

conflicted = '='
ahead = '⇡'
behind = '⇣'
diverged = '⇕'
up_to_date = ''
renamed = ''
stashed = '  $count'

[fill]
symbol = " "

[nodejs]
disabled=false
symbol = " "
format = "[ $symbol$version ]($style bold)"
version_format = "${raw}"

[python]
disabled=false
symbol = " "
format = '[ ${symbol}${pyenv_prefix}(${version})( \($virtualenv\)) ]($style bold)'
version_format = "${raw}"

[java]
disabled = false
symbol = " "
format = "[ $symbol$version ]($style bold)"
version_format = "${raw}"

[gradle]
disabled = false
symbol = " "
format = "(and [$symbol$version]($style bold))"
version_format = "${raw}"

[maven]
disabled = false
symbol = " "
format = "( and [$symbol$version]($style bold))"

[docker_context]
disabled=false
symbol = " "

[cmd_duration]
disabled = false
format = " [took  $duration]($style bold)"
min_time = 500
