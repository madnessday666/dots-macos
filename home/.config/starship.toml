format = """\
(($status )$cmd_duration\n)\
╔═$time \
$username\
$directory\
$os\
$git_branch\
$git_commit\
${custom.git_last_commit_days}\
$git_status\
${custom.git_stash}\
( \
    via\
    $python\
    $conda\
    $nodejs\
    $c\
    $rust\
    $java$gradle$maven\
)\
$docker_context
╚═►(\u2570) \
"""

add_newline = false

[status]
disabled = false
symbol   = "ERROR"
# success_symbol = "OK"
# success_style = "fg:time"
# format = "[$symbol]($style)[$success_symbo]($success_style)\n"
format = "[$symbol]($style)"

[cmd_duration]
disabled = false
format   = "([took  $duration]($style bold))"
min_time = 500

[time]
disabled    = false
format      = "\\[[$time]($style)\\]"
time_format = "%H:%M:%S"
style       = "green"

[username]
disabled    = true
style_user  = "os"
style_root  = "os_admin"
format      = "[  $user](fg:$style) "
show_always = true

[directory]
disabled               = false
format                 = "[$path]($style)[$read_only]($read_only_style)"
truncation_length      = 2
style                  = "blue"
read_only_style        = "fg:directory"
before_repo_root_style = "fg:directory"
truncation_symbol      = "…/"
truncate_to_repo       = true
read_only              = "  "

[os]
disabled = true
format   = "on [($name)]($style)"
style    = "blue"

# [os_symbols]
# Alpine      = " "
# Arch        = " "
# Debian      = " "
# EndeavourOS = " "
# Fedora      = " "
# Linux       = " "
# Macos       = " "
# Manjaro     = " "
# Mint        = " "
# NixOS       = " "
# openSUSE    = " "
# Pop         = " "
# SUSE        = " "
# Ubuntu      = " "
# Windows     = " "

[git_branch]
disabled = false
symbol   = ""
format   = " on [${symbol}${branch}]($style)"
style    = "purple"

[git_commit]
disabled      = false
tag_symbol    = ""
style         = "bright-white underline"
format        = "( [$tag]($style))"
tag_disabled  = false
only_detached = false

[custom.git_last_commit_days]
command = """
commit_time=$(git log -1 --format=%ct 2>/dev/null)
if [ -n "$commit_time" ]; then
  now=$(date +%s)
  diff=$(( (now - commit_time) / 86400 ))
  echo "${diff}d ago"
fi
"""
when = "git rev-parse --is-inside-work-tree 2> /dev/null"
format = "( [$output](yellow))"

[git_status]
disabled = false

format = "([$staged](green)[$untracked](red)[$modified](yellow)[$deleted](red))"

staged    = " +$count"
untracked = " !$count"
modified  = " !$count"
deleted   = " !$count"
stashed   = ""

conflicted = "="
ahead      = "⇡"
behind     = "⇣"
diverged   = "⇕"
up_to_date = ""
renamed    = "R"

[custom.git_stash]
when = 'git rev-parse --verify refs/stash >/dev/null 2>&1'
command = '''
branch=$(git symbolic-ref --short HEAD 2>/dev/null)
count=$(git stash list | wc -l | tr -d " ")
icon=" "

if [ -n "$branch" ] && git stash list | grep -qE "(WIP on|On) ${branch}:"; then
  printf "\033[1;32m%s\033[0m" "$icon$count"
else
  printf "\033[1;37m%s\033[0m" "$icon$count"
fi
'''
format = " $output"

[nodejs]
disabled       = false
symbol         = " "
format         = "([ $symbol$version]($style bold))"
version_format = "${raw}"

[python]
disabled       = false
symbol         = " "
format         = '([ ${symbol}${pyenv_prefix}(${version})( \($virtualenv\))]($style bold))'
version_format = "${raw}"

[java]
disabled       = false
symbol         = " "
format         = "([ $symbol$version]($style bold))"
version_format = "${raw}"

[rust]
symbol         = "🦀 "
disabled       = false
format         = "([ $symbol$version]($style bold))"
version_format = "${raw}"

[gradle]
disabled       = false
symbol         = " "
format         = "( and [$symbol$version]($style bold))"
version_format = "${raw}"

[maven]
disabled = false
symbol   = " "
format   = "( and [$symbol$version]($style bold))"

[docker_context]
disabled = false
symbol   = " "
